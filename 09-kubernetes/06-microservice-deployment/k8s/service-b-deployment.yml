apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b-deployment
  labels:
    name: service-b-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - image: embarkx/tax-service-b
          name: service-b
          resources:
            requests:
              cpu: "250m"
              memory: "250M"
            limits:
              cpu: "500m"
              memory: "500M"
          ports:
            - containerPort: 4000
              name: service-b-port
