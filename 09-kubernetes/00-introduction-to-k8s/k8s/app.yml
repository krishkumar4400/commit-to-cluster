# combined yml file

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    name: app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - image: nginx:latest
          name: nginx
          resources:
            requests:
              cpu: "200m"
              memory: "200M"
            limits:
              cpu: "500m"
              memory: "500M"
          ports:
            - containerPort: 80
              name: nginx-port

---

kind: Service
apiVersion: v1
metadata:
  name: app-service
spec:
  selector:
    app: web
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31000
