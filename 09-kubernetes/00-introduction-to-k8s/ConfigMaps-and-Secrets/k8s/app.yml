# combined yml file

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    name: app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - image: nginx:latest
          name: nginx
          resources:
            requests:
              cpu: "200m"
              memory: "200M"
            limits:
              cpu: "500m"
              memory: "500M"
          ports:
            - containerPort: 80
              name: nginx-port

          # env:
          #   - name:  APP_MESSAGE
          #     value: "Hello from app.yml"

          #   - name: PORT
          #     value: "3000"

          #   - name: DB_PASSWORD
          #     value: "krish@123"

          #   - name: DB_URL
          #     value: "http:db_url:5432"

          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_MESSAGE

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD

---
kind: Service
apiVersion: v1
metadata:
  name: app-service
spec:
  selector:
    app: web
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31000
