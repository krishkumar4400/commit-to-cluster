apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
  labels:
    name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - image: krishkumar4400/node-app:latest
          name: node-app
          imagePullPolicy: Always

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 3000
              name: node-app-port
              