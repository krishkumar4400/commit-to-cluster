<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Static Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      color: #333;
      text-align: center;
    }
    header {
      background: #0073e6;
      color: white;
      padding: 20px 0;
    }
    main {
      padding: 40px;
    }
    footer {
      background: #222;
      color: #ccc;
      padding: 10px 0;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #0073e6;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .btn:hover {
      background: #005bb5;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Static Website</h1>
  </header>
  <main>
    <h2>Hello, World!</h2>
    <p>This is a demo static site hosted on AWS S3.</p>
    <a href="#" class="btn">Learn More</a>
  </main>
  <footer>
    <p>&copy; 2026 My Static Site</p>
  </footer>
</body>
</html>
